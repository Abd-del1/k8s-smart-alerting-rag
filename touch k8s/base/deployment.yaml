apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-alert-api
  namespace: smart-alerting
  labels:
    app: smart-alert-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-alert-api
  template:
    metadata:
      labels:
        app: smart-alert-api
    spec:
      containers:
        - name: smart-alert-api
          image: ghcr.io/YOUR_USERNAME/k8s-smart-alerting-rag:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "dev"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
